<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe8" />

    <title>📷 Dana Serdiuk — фотограф у Івано-Франківську · 2026</title>
    <meta
      name="description"
      content="📷 Кінематографічна фотографія у Івано-Франківську: сімейні та love-story зйомки, персональні портрети, ранок нареченої. Віддача фото 1–2 тижні. Бронювання онлайн."
    />
    <link rel="canonical" href="https://danke-photo.vercel.app/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Dana Serdiuk" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:site_name" content="Dana Serdiuk — Fotograf" />
    <meta property="og:url" content="https://danke-photo.vercel.app/" />
    <meta
      property="og:title"
      content="📷 Dana Serdiuk — фотограф у Івано-Франківську"
    />
    <meta
      property="og:description"
      content="📷 Кінематографічні зйомки у Івано-Франківську: сім'ї, love-story, персональні портрети та ранок нареченої. Віддача фото 1–2 тижні."
    />
    <meta property="og:image" content="https://danke-photo.vercel.app/og-cover-social.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dana Serdiuk — портретна фотографія" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="📷 Dana Serdiuk — фотограф у Івано-Франківськ"
    />
    <meta
      name="twitter:description"
      content="📷 Сімейні та love-story зйомки, персональні портрети, ранок нареченої. Бронювання онлайн."
    />
    <meta name="twitter:image" content="https://danke-photo.vercel.app/og-cover-social.webp" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="modulepreload" href="/src/main.ts" />

    <!-- Critical inline styles: hide raw HTML until JS bundle injects the full CSS -->
    <style>
      body { background: #f4efe8; margin: 0; }
      .page-loader {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: #f4efe8;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .page-loader.is-hidden { display: none; }
    </style>

    <!-- Fonts: preconnect + non-blocking load; display=optional eliminates swap-CLS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=optional"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=optional"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=optional"
      />
    </noscript>

    <!-- JSON-LD: Person + LocalBusiness -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://danke-photo.vercel.app/#person",
            "name": "Dana Serdiuk",
            "jobTitle": "Photographer",
            "url": "https://danke-photo.vercel.app/",
            "sameAs": ["https://instagram.com/"]
          },
          {
            "@type": "LocalBusiness",
            "@id": "https://danke-photo.vercel.app/#business",
            "name": "Dana Serdiuk Photography",
            "image": "https://danke-photo.vercel.app/og-cover.jpg",
            "url": "https://danke-photo.vercel.app/",
            "priceRange": "2000 – 3499 UAH",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Ivano-Frankivsk",
              "addressCountry": "UA"
            },
            "areaServed": "Ivano-Frankivsk"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div class="page-loader" data-loader aria-hidden="true">
      <span class="page-loader__text">Dana Serdiuk</span>
    </div>

    <a class="skip-link" href="#main">Перейти до змісту</a>

    <main id="main">
      <!-- HERO -->
      <section class="hero" id="top" data-section="hero" aria-labelledby="hero-title">
        <div class="hero__media" data-hero-media>
          <img
            class="hero__image"
            data-hero-image
            alt="Dana Serdiuk — портретна фотографія у Івано-Франківську"
            fetchpriority="high"
            decoding="async"
            width="1920"
            height="1280"
          />
          <div class="hero__veil"></div>
        </div>
        <div class="hero__inner">
          <h1 class="hero__title" id="hero-title" data-hero-title>
            <span class="word">Dana</span>
            <span class="word">Serdiuk</span>
          </h1>
          <p class="hero__subtitle" data-reveal="fade">fotograf</p>
          <div class="hero__actions" data-reveal="fade">
            <a href="#gallery" class="btn btn--ghost">
              <span>Дивитись роботи</span>
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            </a>
          </div>
        </div>
      </section>

      <!-- SERVICES -->
      <section class="services" id="services" data-section="services" aria-label="Послуги">
        <div class="services__grid" data-services-grid></div>
      </section>

      <!-- GALLERY -->
      <section class="gallery" id="gallery" data-section="gallery" aria-labelledby="gallery-title">
        <header class="gallery__head">
          <h2 class="gallery__head-title" id="gallery-title" data-reveal="fade">Галерея</h2>
          <p class="gallery__head-desc" data-reveal="fade">Відібрані кадри з останніх зйомок</p>
        </header>

        <div class="gallery__grid" data-gallery-grid></div>

        <!-- Modal Gallery -->
        <div
          class="gallery-modal"
          data-gallery-modal
          role="dialog"
          aria-modal="true"
          aria-label="Галерея на весь екран"
          aria-hidden="true"
        >
          <button
            class="gallery-modal__close"
            type="button"
            aria-label="Закрити галерею"
            data-gallery-close
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
          <div class="gallery-modal__counter" data-gallery-counter aria-live="polite">1 / 1</div>
          <div class="swiper gallery-swiper" data-gallery-swiper>
            <div class="swiper-wrapper" data-gallery-slides></div>
            <button class="gallery-swiper__prev" type="button" aria-label="Попереднє фото">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M15 6l-6 6 6 6" />
              </svg>
            </button>
            <button class="gallery-swiper__next" type="button" aria-label="Наступне фото">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M9 6l6 6-6 6" />
              </svg>
            </button>
          </div>
        </div>
      </section>

      <!-- BOOKING
      <section class="booking" id="booking" data-section="booking" aria-labelledby="booking-title">
        ...
      </section>

      FAQ
      <section class="faq" id="faq" data-section="faq" aria-labelledby="faq-title">
        ...
      </section>
      -->
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="site-footer__top">
        <a href="#top" class="site-footer__brand" aria-label="Dana Serdiuk, фотограф у Івано-Франківську">
          <span class="site-footer__brand-name">Dana Serdiuk</span>
          <span class="site-footer__brand-role">fotograf · Ivano-Frankivsk</span>
        </a>
        <div class="site-footer__socials">
          <a
            href="https://instagram.com/danke.ph"
            target="_blank"
            rel="noopener noreferrer me"
            class="social social--primary"
            aria-label="Instagram — Dana Serdiuk"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
            </svg>
            <span>Instagram</span>
          </a>
          <a
            href="https://t.me/dannkeee"
            target="_blank"
            rel="noopener noreferrer me"
            class="social"
            aria-label="Telegram — написати Dana Serdiuk"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M21 4L2.5 11.5l6 2 2 6L15 15l5 5 1-16z" />
            </svg>
            <span>Telegram</span>
          </a>
        </div>
      </div>
      <div class="site-footer__bottom">
        <span>© <span data-year></span> Dana Serdiuk</span>
        <span>Зроблено з любов'ю</span>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
